name: Furhat Robotics
description: Furhat Robotics builds the Furhat social robot, a customizable robotic
  platform with a back-projected, animated digital face and multi-language voice synthesis
  designed for natural, multi-party human-robot conversation. Developers build interactions
  using the Kotlin Skill API and the Furhat SDK (with a Virtual Furhat for desktop
  development), stream live data through the Realtime API over WebSocket, and rapidly
  prototype LLM-driven characters with the FurhatAI Creator. A deprecated REST Remote
  API with an official Python client is also available. Furhat is widely used across
  academic research, clinical training, mental health, hospitality, and automotive
  human-machine interaction.
